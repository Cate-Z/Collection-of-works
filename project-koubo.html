<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>口播视频剪辑 · 网红团队雪大 — Zhou Yingqi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0a0a;
  --fg:#f2f2ef;
  --dim:rgba(242,242,239,.42);
  --line:rgba(242,242,239,.14);
  --grass:#8cc63f;
  --pad:clamp(18px,3.2vw,44px);
  --sans:'Inter Tight','Helvetica Neue',Helvetica,'PingFang SC','Microsoft YaHei',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  padding-top:calc(clamp(18px,3vh,30px)*2 + 15px);
  background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}

/* header */
.top{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(10,10,10,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(18px,3vh,30px) var(--pad);
  border-bottom:1px solid var(--line);
}
.back{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  transition:color .25s var(--ease);
}
.back:hover{color:var(--grass)}
.idx{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}

/* head block */
.head{padding:clamp(40px,7vh,84px) var(--pad) clamp(26px,4vh,44px)}
.head h1{
  font-size:clamp(2rem,6vw,4.4rem);font-weight:400;letter-spacing:.02em;line-height:1.05;
}
.head .meta{
  margin-top:16px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  display:flex;flex-wrap:wrap;gap:8px 22px;
}
.head .meta b{color:var(--grass);font-weight:400}
.head p{
  margin-top:22px;max-width:620px;font-size:13px;line-height:1.9;color:rgba(242,242,239,.72);
}
.head p b{color:var(--fg);font-weight:400}
.head p .hl{color:var(--grass)}

/* videos */
.videos{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,22px);
  padding:clamp(18px,3vh,36px) var(--pad) clamp(50px,8vh,90px);
}
.vcell{border:1px solid var(--line);overflow:hidden;background:#101010}
.vcell video{
  width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#000;
}
.vcell figcaption{
  padding:10px 12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);border-top:1px solid var(--line);
}
@media (max-width:900px){
  .videos{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .videos{grid-template-columns:1fr;max-width:420px;margin:0 auto}
}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="index.html" onclick="if(history.length>1){history.back();return false;}">← Back / 返回</a>
  <span class="idx">Project · 07</span>
</header>

<section class="head">
  <h1>口播视频剪辑</h1>
  <div class="meta">
    <span><b>Video Editing</b></span><span>网红团队 · 雪大</span><span>口播剪辑 · 种草短视频</span>
  </div>
  <p>长期为网红团队<b>雪大</b>剪辑口播类短视频为主——她的内容以真人出镜口播为核心，<span class="hl">受众群体主要是她的粉丝</span>。剪辑时始终以人物表达为中心：保留自然神态与说话节奏，在关键卖点处叠加花字、贴纸与产品特写，用画面节奏去强化种草信息，而不是让特效喧宾夺主。以下为部分成品：</p>
</section>

<section class="videos">
  <figure class="vcell">
    <video src="https://raw.githubusercontent.com/Cate-Z/Collection-of-works/main/assets/video/07-koubo-1-foundation.mp4" controls preload="metadata" playsinline></video>
    <figcaption>粉底液口播 · 成品</figcaption>
  </figure>
  <figure class="vcell">
    <video src="https://raw.githubusercontent.com/Cate-Z/Collection-of-works/main/assets/video/07-koubo-2-eye-oil-01.mp4" controls preload="metadata" playsinline></video>
    <figcaption>眼油 ① · 成品</figcaption>
  </figure>
  <figure class="vcell">
    <video src="https://raw.githubusercontent.com/Cate-Z/Collection-of-works/main/assets/video/07-koubo-3-eye-oil-02.mp4" controls preload="metadata" playsinline></video>
    <figcaption>眼油 ② · 成品</figcaption>
  </figure>
</section>

<script>
/* 返回栏带回当前分类：从哪个筛选栏进来，就退回哪个筛选栏 */
(function(){
  var f = new URLSearchParams(location.search).get('f');
  var a = document.querySelector('.back');
  if(f && a) a.setAttribute('href', 'index.html?f=' + encodeURIComponent(f));
})();
</script>
</body>
</html>
